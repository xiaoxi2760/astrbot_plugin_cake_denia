name: astrbot_plugin_cake_denia
display_name: 🍰娅娅的小蛋糕
short_desc: 发送 🍰 给鸣潮达妮娅（娅娅）喂小蛋糕的趣味插件
desc: |
  一款为 AstrBot 框架设计的鸣潮达妮娅（娅娅）专属喂蛋糕插件。

  今天你给娅娅喂小蛋糕了吗？发送 🍰（或「蛋糕」）就可以给娅娅喂一块小蛋糕！

  ## 功能
  - 🍰 / 蛋糕 喂蛋糕（连发计数），娅娅撒娇回应 + 粉色日历图
  - 🍰 @某人 替别人喂蛋糕
  - 🍰日历 / 🍰报告 [月|年] / 🍰生涯 / 🍰补签 / 🍰榜 [页] / 🍰成就 / 🍰帮助
  - 🏆 成就系统：累计、连续、单日暴击、替喂/被喂共 13 项成就
  - 🤖 LLM 概率对话：喂到一定数量后娅娅会用 LLM 撒娇回应（可配置概率与次数限制）
  - 群白名单、用户黑名单、每日/每月上限等均可配置
version: 0.0.0
